<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>QA menu</title>
<style>html,body{margin:0;background:#fff}#f{border:0;display:block;width:360px;height:600px}</style></head>
<body><iframe id="f" src="/"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var f = this;

    f.contentDocument.getElementById('menu-toggle').click();
  }, 500);
});
</script>
</body></html>
